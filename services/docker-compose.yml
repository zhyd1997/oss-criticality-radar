name: oss-criticality-radar

services:
  score:
    build: ./score
    # Bind to loopback only so an unauthenticated local process is not LAN-exposed.
    # Production/non-local deploys should set SCORE_SERVICE_TOKEN (via env_file).
    ports:
      - "127.0.0.1:8080:8080"
    # Inject secrets/config into the container from optional files.
    # Do NOT re-list GITHUB_AUTH_TOKEN / SCORE_SERVICE_TOKEN / SCORE_MAX_CONCURRENCY
    # under `environment`: it overrides env_file, so ${VAR:-...} interpolation
    # would replace the .env.local value with a blank or a default.
    env_file:
      - path: ../.env.local
        required: false
      - path: ./score/.env
        required: false
    environment:
      PORT: "8080"
